<!doctype html>
<!-- Source of docs/share-card.png (1200 x 630, the Open Graph size). Render with tools/share-card.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Easy Markup share card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@700&display=swap">
<style>
  :root { --ink: #1d2327; --muted: #55606b; --line: #e2e5ea; --accent: #2271b1; --soft: #e8f1f9; --paper: #fbfbfc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", Arial, sans-serif; }
  .card { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 560px 1fr; gap: 48px; padding: 72px 72px 64px; }
  .text { display: flex; flex-direction: column; }
  .eyebrow { font: 500 18px "IBM Plex Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 22px; }
  h1 { font: 700 84px/0.98 "Space Grotesk", Arial, sans-serif; letter-spacing: -0.03em; margin: 0 0 26px; }
  .lede { font-size: 29px; line-height: 1.35; color: var(--muted); margin: 0; }
  .lede b { color: var(--ink); font-weight: 500; }
  .foot { margin-top: auto; display: flex; gap: 12px; align-items: center; font: 500 19px "IBM Plex Mono", monospace; color: var(--muted); }
  .chip { border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fff; }

  /* A page with a framed block and a comment, as the plugin shows it. */
  .stage { position: relative; }
  .page { position: absolute; left: 0; top: 6px; width: 380px; height: 500px; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; box-shadow: 0 24px 60px rgba(29, 35, 39, 0.12); padding: 34px 34px; }
  .bar { height: 12px; border-radius: 6px; background: #e9ecf0; margin-bottom: 14px; }
  .h { height: 26px; width: 62%; background: #cfd5dc; border-radius: 7px; margin-bottom: 22px; }
  .w90 { width: 90%; } .w80 { width: 80%; } .w70 { width: 70%; } .w55 { width: 55%; }
  .block { position: relative; padding: 14px 12px 2px; margin: 18px -12px 18px; border-radius: 8px; outline: 4px solid var(--accent); outline-offset: 0; background: var(--soft); }
  .block .bar { background: #b9cde0; }
  .btn { position: absolute; right: 28px; bottom: 28px; background: var(--ink); color: #fff; font: 500 17px "IBM Plex Sans", sans-serif; padding: 11px 20px; border-radius: 999px; }
  .comment { position: absolute; left: 178px; top: 226px; width: 290px; background: #fff; border-radius: 12px; box-shadow: 0 18px 44px rgba(29, 35, 39, 0.2); padding: 18px 20px; border: 1.5px solid var(--line); }
  .comment .who { display: flex; align-items: center; gap: 10px; font: 500 16px "IBM Plex Sans", sans-serif; margin-bottom: 8px; }
  .comment .dot { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font: 700 14px "Space Grotesk", sans-serif; }
  .comment .msg { font-size: 19px; line-height: 1.35; }
  .comment .tag { margin-top: 10px; font: 500 13px "IBM Plex Mono", monospace; color: var(--muted); }
  .tail { position: absolute; left: -9px; top: 30px; width: 16px; height: 16px; background: #fff; border-left: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); transform: rotate(45deg); }
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <p class="eyebrow">WordPress plugin</p>
    <h1>Easy Markup</h1>
    <p class="lede">Comment on any page, or <b>any block</b>, right where it is. Send a review link and clients can too.</p>
    <div class="foot"><span class="chip">Docs</span><span>mjoslyn.github.io/wp-easy-markup</span></div>
  </div>
  <div class="stage" aria-hidden="true">
    <div class="page">
      <div class="h"></div>
      <div class="bar w90"></div>
      <div class="bar w80"></div>
      <div class="bar w55"></div>
      <div class="block">
        <div class="bar w90"></div>
        <div class="bar w70"></div>
      </div>
      <div class="bar w80"></div>
      <div class="bar w90"></div>
      <div class="bar w70"></div>
      <div class="btn">Done commenting</div>
    </div>
    <div class="comment">
      <div class="tail"></div>
      <div class="who"><span class="dot">J</span>Jordan</div>
      <div class="msg">Can we show a starting price here?</div>
      <div class="tag">Paragraph · review link</div>
    </div>
  </div>
</div>
</body>
</html>
